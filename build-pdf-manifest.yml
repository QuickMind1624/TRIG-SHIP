name: Build PDF manifest

on:
  push:
    paths:
      - 'pdfs/**/*.pdf'
      - '.github/workflows/build-pdf-manifest.yml'

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate PDF manifest without overwriting existing metadata
        shell: python
        run: |
          import json
          from pathlib import Path
          manifest_path = Path('pdfs/manifest.json')
          try:
              existing = json.loads(manifest_path.read_text(encoding='utf-8'))
          except Exception:
              existing = []
          existing_by_id = {x.get('id'): x for x in existing if isinstance(x, dict) and x.get('id')}
          files = sorted(Path('pdfs').glob('*.pdf'))
          items = []
          for p in files:
              slug = p.stem
              item = dict(existing_by_id.get(slug, {}))
              item.setdefault('id', slug)
              item.setdefault('title', slug.replace('-', ' ').replace('_', ' ').title())
              item.setdefault('classLevel', 'Other')
              item.setdefault('subject', 'Other')
              item.setdefault('status', 'free')
              item.setdefault('type', 'pdf')
              item.setdefault('description', 'Free study resource.')
              item.setdefault('tags', ['free resource'])
              item['file'] = p.as_posix()
              item.setdefault('actionLabel', 'Open PDF')
              items.append(item)
          manifest_path.write_text(json.dumps(items, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

      - name: Commit manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pdfs/manifest.json
          git diff --cached --quiet || git commit -m 'Update PDF manifest'
          git push
