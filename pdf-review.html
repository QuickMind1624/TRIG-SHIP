<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The System of Quadrants — PDF Review</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#111827;color:#fff}
body{display:flex;flex-direction:column;overflow:hidden}
.viewer-header{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 16px;background:#18202c;border-bottom:1px solid #3b4657}
.viewer-title{margin:0;font-size:16px;font-weight:700}
.viewer-actions{display:flex;align-items:center;gap:8px}
.viewer-actions a,.viewer-actions button{appearance:none;border:1px solid #68768b;border-radius:8px;padding:9px 13px;background:#263246;color:#fff;text-decoration:none;font:600 14px Arial,Helvetica,sans-serif;cursor:pointer;white-space:nowrap}
.viewer-actions a.download{background:#fff;color:#111827;border-color:#fff}
.viewer-wrap{position:relative;flex:1;min-height:0;background:#dfe3e8}
.viewer-frame{display:block;width:100%;height:100%;border:0;background:#fff}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#1f2937;text-align:center;padding:20px}
.fallback a{pointer-events:auto;color:#111827}
@media(max-width:650px){.viewer-header{height:auto;min-height:64px;flex-wrap:wrap}.viewer-title{max-width:100%;font-size:14px}.viewer-actions a,.viewer-actions button{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<header class="viewer-header">
  <h1 class="viewer-title">The System of Quadrants — Review (7 pages)</h1>
  <div class="viewer-actions">
    <a class="download" href="pdfs/system-of-quadrants-trigonometry-notes.pdf" download>Download Full PDF</a>
    <button type="button" onclick="goBack()">Back</button>
  </div>
</header>
<main class="viewer-wrap">
  <iframe class="viewer-frame" src="pdfs/review/system-of-quadrants-trigonometry-notes-preview-7pages.pdf" title="7-page PDF review"></iframe>
  <div class="fallback">If the PDF viewer is unavailable in this browser, <a href="pdfs/review/system-of-quadrants-trigonometry-notes-preview-7pages.pdf" target="_blank" rel="noopener">open the 7-page review</a>.</div>
</main>
<script>
function goBack(){
  if(history.length>1){history.back();}
  else{location.href='index.html#learningHub';}
}
</script>
</body>
</html>
